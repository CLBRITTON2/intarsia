// intarsia reads this from %USERPROFILE%\.config\intarsia\style.conf, beside config.lua. docs/styling.md lists every
// block and property. A block is a key with its lines indented two spaces beneath it, and a module's block is its name
// in config.lua. Numbers are DIPs with no unit, and anything outside the format is an error naming the line.

vars:
  foreground: #f2f2f2
  muted: #a3a3a3
  accent: #60a5fa
  background: #1c1c1e
  border: #ffffff 8%
  hover: #ffffff 10%
  red: #f87171
  yellow: #facc15

bar:
  font: Segoe UI
  size: 13
  color: $foreground

section:
  margin: 6
  padding: 3
  background: $background 92%
  border: 1 $border
  radius: 10

tooltip:
  padding: 8
  background: $background 98%
  border: 1 $border
  radius: 8

menu:
  padding: 4
  background: $background 98%
  border: 1 $border
  radius: 8
  max-width: 480
  max-height: 400
  scrollbar:
    width: 3
    margin: 4 3
    background: $muted
    radius: 2
  item:
    padding: 4 10
    radius: 4
    hover:
      background: $hover
    active:
      color: $accent

// Every module, under its own block below.
module:
  padding: 0 10
  radius: 7
  icon:
    font: Segoe MDL2 Assets
    size: 14
    margin-right: 7
    color: $accent
  alert:
    color: $red
  // The workspace, window or tray icon under the cursor. A focused workspace keeps its own colors.
  item:
    hover:
      background: $hover

workspaces:
  padding: 0 2
  item:
    padding: 2 8
    margin: 0 1
    radius: 6
    focused:
      color: #1c1c1e
      background: $accent
      weight: bold
    empty:
      color: $muted

// Window icons draw at the icon's size. A line opens the windows, its margin across the bar keeping it clear of the
// section's edges and its square corners keeping it straight.
apps:
  padding: 0 2
  margin: 3 0
  border-left: 1 #ffffff 20%
  radius: 0
  item:
    padding: 3
    margin: 0 1
    radius: 5
    focused:
      background: $hover

mode:
  padding: 0
  item:
    color: $yellow
    weight: bold
    padding: 2 8
    margin: 0 3
    radius: 6

tiling:
  padding: 0 6
  icon:
    margin-right: 0
  hover:
    background: $hover

// Tray icons, and the toggle's chevron after them, draw at the icon's size. A tray takes two transitions: its width as
// it unfolds, and its icon's rotation, turning to the expanded rotation while unfolded.
tray:
  padding: 0 3
  transition: width 300ms ease-out
  icon:
    size: 11
    transition: rotate 250ms ease
  expanded:
    icon:
      rotate: 180
  item:
    padding: 4
    margin: 0 1
    radius: 5
    toggle:
      padding: 6 8
      radius: 7

net:
  hover:
    background: $hover

cpu:
  hover:
    background: $hover

memory:
  hover:
    background: $hover

volume:
  hover:
    background: $hover
  muted:
    color: $muted
    icon:
      color: $muted

battery:
  hover:
    background: $hover
  warning:
    icon:
      color: $yellow
  critical:
    color: $red
    icon:
      color: $red

clock:
  hover:
    background: $hover
