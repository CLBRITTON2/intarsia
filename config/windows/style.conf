// A dark bar of floating sections. docs/styling.md lists every block and property.

vars {
  foreground: #f2f2f2
  muted: #a3a3a3
  accent: #60a5fa
  background: #1c1c1e
  border: #ffffff 8%
  hover: #ffffff 10%
  red: #f87171
  yellow: #facc15
}

bar {
  font: Segoe UI
  size: 13
  color: $foreground
}

section {
  margin: 6
  padding: 3
  background: $background 92%
  border: 1 $border
  radius: 10
}

tooltip {
  padding: 8
  background: $background 98%
  border: 1 $border
  radius: 8
}

menu {
  padding: 4
  background: $background 98%
  border: 1 $border
  radius: 8
  max-width: 480
  max-height: 400
  scrollbar {
    width: 3
    margin: 4 3
    background: $muted
    radius: 2
  }
  item {
    padding: 4 10
    radius: 4
    hover {
      background: $hover
    }
    active {
      color: $accent
    }
  }
}

module {
  padding: 0 10
  radius: 7
  icon {
    font: Segoe MDL2 Assets
    size: 14
    margin-right: 7
    color: $accent
  }
  alert {
    color: $red
  }
  item {
    hover {
      background: $hover
    }
  }
}

title {
  color: $muted
}

tray {
  padding: 0 3
  transition: width 300ms ease-out
  icon {
    size: 11
    transition: rotate 250ms ease
  }
  expanded {
    icon {
      rotate: 180
    }
  }
  item {
    padding: 4
    margin: 0 1
    radius: 5
    toggle {
      padding: 6 8
      radius: 7
    }
  }
}

cpu {
  hover {
    background: $hover
  }
}

memory {
  hover {
    background: $hover
  }
}

volume {
  hover {
    background: $hover
  }
  muted {
    color: $muted
    icon {
      color: $muted
    }
  }
}

battery {
  hover {
    background: $hover
  }
  warning {
    icon {
      color: $yellow
    }
  }
  critical {
    color: $red
    icon {
      color: $red
    }
  }
}

clock {
  hover {
    background: $hover
  }
}
