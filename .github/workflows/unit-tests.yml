name: Unit and config tests

on: workflow_dispatch

jobs:
  unit-tests:
    # windows-2025 carries Visual Studio 2026, and the scripts pin Visual Studio 2022 and its bundled LLVM.
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5
      - name: unit and config tests
        shell: pwsh
        run: ./scripts/test.ps1
