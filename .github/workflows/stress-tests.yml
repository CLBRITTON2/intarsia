name: Stress tests

on:
  workflow_dispatch:
    inputs:
      preset:
        description: Build to stress test
        type: choice
        options: [release, debug]
        default: release
      seconds:
        description: Seconds per scenario
        type: number
        default: 60

jobs:
  stress-tests:
    # windows-2025 carries Visual Studio 2026, and the scripts pin Visual Studio 2022 and its bundled LLVM.
    runs-on: windows-2022
    # A hung scenario would otherwise burn the six hour default of the account's Windows minutes.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - name: stress tests
        shell: pwsh
        # Through the environment, never interpolated into the script, so no input can inject a command.
        env:
          STRESS_PRESET: ${{ inputs.preset }}
          STRESS_SECONDS: ${{ inputs.seconds }}
          STRESS_LOGS: ${{ runner.temp }}\stress
        run: ./scripts/stress.ps1 -Preset $env:STRESS_PRESET -Seconds ([int] $env:STRESS_SECONDS) -LogRoot $env:STRESS_LOGS
      - name: upload stress logs
        # Most useful when the stress tests failed.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stress-logs
          path: ${{ runner.temp }}\stress
          if-no-files-found: error
