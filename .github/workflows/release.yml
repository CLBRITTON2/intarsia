name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, as major.minor.patch, with a section in CHANGELOG.md
        type: string
        required: true

permissions:
  contents: read

jobs:
  build:
    # windows-2025 carries Visual Studio 2026, and the scripts pin Visual Studio 2022 and its bundled LLVM.
    runs-on: windows-2022
    # A hung step would otherwise burn the six hour default of the account's Windows minutes.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: unit tests
        shell: pwsh
        run: ./scripts/run-unit-tests.ps1
      - name: build and package
        shell: pwsh
        # Through the environment, never interpolated into the script, so no input can inject a command.
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: ./scripts/package-release.ps1 -Version $env:RELEASE_VERSION
      - name: upload package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: intarsia-${{ inputs.version }}
          path: |
            build/dist/intarsia-*.zip
            build/dist/release-notes.md
          if-no-files-found: error

  # Only this job holds a token that can write, and it runs no build or test code.
  publish:
    needs: build
    runs-on: windows-2022
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: download package
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: intarsia-${{ inputs.version }}
          path: build/dist
      - name: publish
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_COMMIT: ${{ github.sha }}
          RELEASE_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/publish-release.ps1 -Version $env:RELEASE_VERSION -Commit $env:RELEASE_COMMIT -Token $env:RELEASE_TOKEN
