name: Soak tests

on:
  workflow_dispatch:
    inputs:
      preset:
        description: Build to soak test
        type: choice
        options: [release, debug]
        default: release
      seconds:
        description: Seconds per scenario
        type: number
        default: 60

permissions:
  contents: read

jobs:
  soak-tests:
    # windows-2025 carries Visual Studio 2026, and the scripts pin Visual Studio 2022 and its bundled LLVM.
    runs-on: windows-2022
    # A hung scenario would otherwise burn the six hour default of the account's Windows minutes.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: soak tests
        shell: pwsh
        # Through the environment, never interpolated into the script, so no input can inject a command.
        env:
          SOAK_PRESET: ${{ inputs.preset }}
          SOAK_SECONDS: ${{ inputs.seconds }}
          SOAK_LOGS: ${{ runner.temp }}\soak
        run: ./scripts/run-soak-tests.ps1 -Preset $env:SOAK_PRESET -Seconds ([int] $env:SOAK_SECONDS) -LogRoot $env:SOAK_LOGS
      - name: upload soak logs
        # Most useful when the soak tests failed.
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: soak-logs
          path: ${{ runner.temp }}\soak
          if-no-files-found: error
