name: Integration tests

on: workflow_dispatch

permissions:
  contents: read

jobs:
  integration-tests:
    # windows-2025 carries Visual Studio 2026, and the scripts pin Visual Studio 2022 and its bundled LLVM.
    runs-on: windows-2022
    # A hung test would otherwise burn the six hour default of the account's Windows minutes.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: integration tests
        shell: pwsh
        run: ./scripts/run-integration-tests.ps1
